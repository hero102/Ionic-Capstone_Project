<ion-tabs>
  <ion-tab-bar slot="bottom" color="primary">
    <ion-tab-button tab="dashboard" [routerLink]="['/admin/dashboard']">
      <ion-icon name="speedometer-outline"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="trips" [routerLink]="['/admin/trips']">
      <ion-icon name="briefcase-outline"></ion-icon>
      <ion-label>Trips</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="destinations" [routerLink]="['/admin/destinations']">
      <ion-icon name="location-outline"></ion-icon>
      <ion-label>Destinations</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="settings" [routerLink]="['/admin/settings']">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
