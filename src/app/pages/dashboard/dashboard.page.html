<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ auth.isAdmin() ? 'Admin Dashboard' : 'User Dashboard' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- ⏳ Loader -->
  <ion-spinner *ngIf="loading()" name="crescent" class="ion-text-center"></ion-spinner>

  <ion-grid *ngIf="!loading()">
    <!-- 📦 Stats -->
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="3">
        <ion-card color="light">
          <ion-card-header><ion-card-title>Total Trips</ion-card-title></ion-card-header>
          <ion-card-content><h2>{{ totalTrips() }}</h2></ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6" size-lg="3">
        <ion-card color="tertiary">
          <ion-card-header><ion-card-title>Featured Trips</ion-card-title></ion-card-header>
          <ion-card-content><h2>{{ featuredTrips() }}</h2></ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6" size-lg="3">
        <ion-card color="success">
          <ion-card-header><ion-card-title>Active Categories</ion-card-title></ion-card-header>
          <ion-card-content><h2>{{ activeCategories() }}</h2></ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <!-- 📊 Chart Section -->
    <ion-row>
      <ion-col size="12">
        <ion-card>
          <ion-card-header><ion-card-title>Trips by Category</ion-card-title></ion-card-header>
          <ion-card-content>
            <div class="chart-container">
              <canvas #categoryCanvas></canvas>
            </div>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <!-- 📋 Category Breakdown -->
    <ion-card>
      <ion-card-header><ion-card-title>Category Breakdown</ion-card-title></ion-card-header>
      <ion-card-content>
        <ion-list *ngIf="byCategory().length > 0; else noData">
          <ion-item *ngFor="let cat of byCategory()">
            <ion-label>
              <strong>{{ cat.name }}</strong>
            </ion-label>
            <ion-badge color="primary" slot="end">{{ cat.count }}</ion-badge>
          </ion-item>
        </ion-list>
        <ng-template #noData>
          <ion-text color="medium">
            <p class="ion-text-center">No data available</p>
          </ion-text>
        </ng-template>
      </ion-card-content>
    </ion-card>
  </ion-grid>
</ion-content>
