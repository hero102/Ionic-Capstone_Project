<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Explore Trips</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="loadTrips()">Reload</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-searchbar
    placeholder="Search destinations..."
    (ionInput)="onSearchChange($event)"
  ></ion-searchbar>

  <!-- Loader -->
  <ion-spinner
    *ngIf="loading()"
    class="ion-text-center ion-margin"
    name="crescent"
  ></ion-spinner>

  <!-- Instagram-style grid -->
  <ion-grid>
    <ion-row>
      <ion-col
        size="12"
        size-sm="6"
        size-md="4"
        *ngFor="let trip of filteredTrips()"
        class="trip-card"
      >
        <ion-card class="trip-card-container" (click)="openTripModal(trip)">
          <div class="image-wrapper">
            <ion-img [src]="trip.image"></ion-img>

            <!-- Overlay -->
            <div class="overlay">
              <div class="overlay-top">
                <ion-badge color="dark">{{ trip.destination?.category || 'Uncategorized' }}</ion-badge>
                <ion-badge color="warning">★ {{ trip.rating || 0 }}</ion-badge>
              </div>

              <div class="overlay-bottom">
                <h2>{{ trip.title }}</h2>
                <p>{{ trip.destination?.name || 'Unknown' }}</p>
              </div>
            </div>
          </div>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-text *ngIf="!loading() && filteredTrips().length === 0" color="medium">
    <p class="ion-text-center ion-margin-top">No trips found.</p>
  </ion-text>
</ion-content>
